function makeTransfer(){
  const fromKey=state.bankSession,from=state.accounts[fromKey],toKey=$("transferRecipient")?.value,amount=Number($("transferAmount")?.value),ref=($("transferReference")?.value||"").trim();
  if(!from){toast("Sign in to First Bank first.");return;}
  if(!toKey||!state.accounts[toKey]||toKey===fromKey){toast("Choose a valid recipient account.");return;}
  if(!Number.isFinite(amount)||amount<=0){toast("Enter an amount greater than zero.");return;}
  if(amount>from.balance){toast("Insufficient funds.");return;}
  from.balance=Math.round((from.balance-amount)*100)/100;state.accounts[toKey].balance=Math.round((state.accounts[toKey].balance+amount)*100)/100;
  const transfer=`${new Date().toLocaleTimeString()} — Transfer ${money(amount)} to ${state.accounts[toKey].name} (${state.accounts[toKey].number}) · ${ref||"No reference"}`;
  state.activity[fromKey].push(transfer);state.activity[toKey].push(`${new Date().toLocaleTimeString()} — Received ${money(amount)} from ${from.name} (${from.number}) · ${ref||"No reference"}`);
  serverLog("bank",`TRANSFER ${money(amount)} FROM ${from.username} TO ${state.accounts[toKey].username} / ${ref||"NO REFERENCE"}`);
  toast("Transfer sent: "+money(amount));renderBankDashboard();
}

function runSoftware(id){
  if(!state.owned.includes(id)){toast("That program is not on your desktop. Download it first.");return;}
  const f=software[id];
  if(f.kind==="cracker"){
    if(state.view!=="adminLogin"||!state.currentSite){toast("Open the target website's Admin Login page first.");return;}
    const site=state.currentSite;
    if(f.level<state.server[site].required){toast(`This target requires Password Cracker L${state.server[site].required}.`);return;}
    if(state.cracked[site]){toast("Password is already calculated.");return;}
    startCrack(site,f.level);return;
  }
  if(f.kind==="waterwall"){
    if(state.view!=="adminLogin"||!state.currentSite){toast("Open the target website's Admin Login page first.");return;}
    const site=state.currentSite,srv=state.server[site];
    if(!state.cracked[site]){toast("Crack the password before running Waterwall.");return;}
    if(!srv.firewall){toast("No firewall detected on this server.");return;}
    if(f.level<srv.firewall){toast(`Waterwall L${srv.firewall} or higher is needed.`);return;}
    state.bypassed[site]=true;serverLog(site,"WATERWALL L"+f.level+" EXECUTED / FIREWALL BYPASSED");toast("Firewall bypassed. Enter the backend.");renderAdminLogin(site);return;
  }
  if(f.kind==="uploader"){
    if(state.view!=="backend"||!state.access[state.currentSite]){toast("Open a compromised server backend first.");return;}
    state.backendTab="upload";serverLog(state.currentSite,"OPEN nefariousUploader.exe");renderBackend(state.currentSite,"upload");return;
  }
  if(f.kind==="cash"){renderCashout();return;}
  if(f.kind==="antimalware"){state.antimalware=true;localLog("Anti-Malware installed and activated.");toast("Anti-Malware protection is active.");renderRouter("security");return;}
  if(f.kind==="payload"){toast("Warez Virus is a payload. Run nefariousUploader.exe from inside a compromised server backend to install it.");return;}
}

function startCrack(site,level) {
  if(!state.server[site]){toast("This host has no registered admin service.");return;}
  if(state.crack&&!state.crack.ready&&state.crack.site!==site){toast("Another cracking process is already running.");return;}
  if(state.crack&&!state.crack.ready&&state.crack.site===site){toast("Password calculation is already running.");renderCrackerWindow("crc"+state.crack.level);return;}
  const duration=Math.max(1.3,8-level*1.3)*networkLatencyV11();
  state.crack={site,level,elapsed:0,total:duration,ready:false,display:""};
  state.server[site].crackStartedAt=Date.now();
  serverLog(site,`PASSWORD CRACKER L${level} STARTED`);
  renderAdminLogin(site);renderCrackerWindow("crc"+level);
}
function continueCrack() {
  if(!state.crack||!state.crack.ready)return;

  state.cracked[site]=true;state.server[site].lastCrackerLevel=level;state.server[site].lastCrackedAt=Date.now();

function contextAction(action,type,site,key) {
  $("contextMenu")?.classList.add("hidden");
  if(type==="serverFile") {
    if(action==="open"){openServerFileV11(site,key);return;}
    if(action==="download"){downloadServerFile(site,key);return;}
    const srv=state.server[site];if(!srv)return;
    srv.files=srv.files.filter(n=>n!==key);
    delete srv.fileInfections?.[key];delete srv.fileContents?.[key];
    srv.uploaded=srv.uploaded.filter(f=>f.name!==key);
    serverLog(site,"DELETE FILE / "+key);toast("Deleted "+key+" from server.");renderBackend(site,"files");return;
  }
  if(type==="localSoftware") {
    if(action==="open"){runSoftware(key);return;}
    if(action==="scan"){scanSoftwareV11(key);return;}
    if(action==="delete"){state.owned=state.owned.filter(id=>id!==key);delete state.softwareInfections[key];delete state.quarantinedSoftware[key];localLog("Deleted local software "+(software[key]?.name||key));refreshDesktopIcons();refreshExplorerV11();toast("Program deleted from computer.");return;}
  }
  if(type==="localFile") {
    const f=state.localFiles.find(x=>x.name===key);if(!f)return;
    if(action==="open"){openLocalFileV11(f);return;}
    if(action==="scan"){scanLocalFileV11(f);return;}
    if(action==="extract"){openExtractorForFileV11(f);return;}
    if(action==="embed"){openEmbedderForFileV11(f);return;}
    if(action==="delete"){state.localFiles=state.localFiles.filter(x=>x!==f);localLog("Deleted local file "+key);refreshExplorerV11();toast("File deleted.");return;}
  }
}

function getFileInfectionV11(site,name) {

    return renderBackend(site,"adminlogs");

  if(name==="accounts.db"&&(site==="bank"||site==="crown"))return openTextWindow(name,serverFileContentV11(site,name));
  if(name==="target-ip.txt"&&site==="whois"){state.flags.mysteryKnown=true;state.domains["9.9.9.9"]="mystery";}
  if(name==="bank-details.txt"&&site==="terry"){
    const c="Terry Schwarz — personal banking notes\nCrown Reserve Bank: crownreserve.bank\nUsername: terry.schwarz\nPassword: t3rry-1979\nAccount: 220013";
    openTextWindow(name,c);serverLog(site,"OPEN FILE / bank-details.txt");return;

}
function downloadServerFile(site,name){

  if(state.server[site].kind==="npcpc"&&Date.now()<(state.server[site].offlineUntil||0)){toast("Network error: target workstation is temporarily offline.");return;}
  const match=Object.values(software).find(f=>f.name+f.ext===name);
  queueNetworkDownloadV11(site,name,match?.id||null);
}

    const docs=state.localFiles.filter(f=>(state.localFileFolders[f.name]||((f.name==="bank-info.txt")?"desktop":"downloads"))==="desktop").map(renderLocalFileRowV16).join("");
    const programs=state.owned.map(id=>renderSoftwareRowV16(id,false)).join("");

function dropOnFolderV16(event,folder){
  event.preventDefault();const payload=state.dragPayloadV16;if(!payload){toast("Select a file first.");return;}
  if(payload.type==="localFile"){
    state.localFileFolders[payload.name]=folder==="desktop"?"desktop":folder==="archive"?"archive":folder==="recycle"?"recycle":"downloads";
    if(folder==="recycle"){const file=state.localFiles.find(f=>f.name===payload.name);if(file){state.localFiles=state.localFiles.filter(x=>x!==file);state.recycleBin.push({type:"file",item:file,deletedAt:Date.now()});}}
  }else if(payload.type==="software"||payload.type==="archiveSoftware"){
    const id=payload.id;
    if(folder==="archive"){if(!state.archiveSoftware.some(x=>x.id===id))state.archiveSoftware.push({id,archivedAt:Date.now()});state.owned=state.owned.filter(x=>x!==id);}
    else if(folder==="recycle"){state.owned=state.owned.filter(x=>x!==id);state.archiveSoftware=state.archiveSoftware.filter(x=>x.id!==id);state.recycleBin.push({type:"software",id,deletedAt:Date.now()});}
    else if(folder==="desktop"){const existing=ownedFamily(software[id].family);if(existing&&software[existing].level<software[id].level)installSoftwareLocally(id);else if(!state.owned.includes(id)&&(!existing||software[existing].level===software[id].level)){state.owned.push(id);state.archiveSoftware=state.archiveSoftware.filter(x=>x.id!==id);}}
  }
  state.dragPayloadV16=null;localLog("Moved file item to "+folder+".");refreshExplorerV11();toast("Item moved to "+folder+".");
}

}

function installSoftwareLocally(id){
  id=canonicalSoftwareId(id);const f=software[id];if(!f)return false;
  const existing=ownedFamily(f.family);
  if(existing&&existing!==id){
    const existingLevel=software[existing].level;
    if(existingLevel>f.level){
      if(!state.archiveSoftware.some(x=>x.id===id))state.archiveSoftware.push({id,archivedAt:Date.now()});
      toast(`${f.name} downloaded into Archive; the higher-level active copy remains installed.`);
      refreshDesktopIcons();refreshExplorerV11();return true;
    }
    if(!state.archiveSoftware.some(x=>x.id===existing))state.archiveSoftware.push({id:existing,archivedAt:Date.now()});
    state.owned=state.owned.filter(x=>x!==existing);
  }
  state.owned=state.owned.filter(x=>x!==id);
  state.owned.push(id);state.archiveSoftware=state.archiveSoftware.filter(x=>x.id!==id);
  delete state.quarantinedSoftware[id];localLog("Installed local software: "+f.name+f.ext);

}

function contextAction(action,type,site,key){
  $("contextMenu")?.classList.add("hidden");
  if(type==="serverFile"){
    if(action==="open"){openServerFileV16(site,key);return;}
    if(action==="download"){downloadServerFile(site,key);return;}
    const srv=state.server[site];if(!srv)return;
    srv.files=srv.files.filter(n=>n!==key);srv.uploaded=srv.uploaded.filter(f=>f.name!==key);
    delete srv.fileInfections?.[key];delete srv.fileContents?.[key];
    if(/^(system|connection-logs|admin-access|workstation)\.log$/.test(key)){if(key==="connection-logs.txt")state.connectionLogs[site]="";else state.logs[site]="";toast("Log file deleted without recording the deletion.");}
    else {serverLog(site,"DELETE FILE / "+key);toast("Deleted "+key+" from server.");}
    renderBackend(site,"files");return;
  }
  if(type==="localFile"){
    const f=state.localFiles.find(x=>x.name===key);if(!f)return;
    if(action==="open"){openLocalFileV11(f);return;}if(action==="scan"){scanLocalFileV11(f);return;}
    if(action==="extract"){openExtractorForFileV11(f);return;}if(action==="embed"){openEmbedderForFileV11(f);return;}
    if(action==="delete"){state.localFiles=state.localFiles.filter(x=>x!==f);state.recycleBin.push({type:"file",item:f,deletedAt:Date.now()});localLog("Moved "+key+" to Recycle Bin.");refreshExplorerV11();return;}
  }
  if(type==="localSoftware"||type==="archiveSoftware"){
    if(action==="scan"){scanSoftwareV11(key);return;}
    if(action==="restore"){dropOnFolderV16({preventDefault:()=>{}}, "desktop");return;}
    if(action==="delete"){state.owned=state.owned.filter(x=>x!==key);state.archiveSoftware=state.archiveSoftware.filter(x=>x.id!==key);state.recycleBin.push({type:"software",id:key,deletedAt:Date.now()});localLog("Moved "+software[key].name+" to Recycle Bin.");refreshExplorerV11();toast("Moved to Recycle Bin.");return;}
    if(action==="open"){runSoftware(key);return;}
  }
}

function runSoftware(id){
  id=canonicalSoftwareId(id);const f=software[id];if(!f){toast("Software executable not found.");return;}
  const installed=state.owned.includes(id)||state.archiveSoftware.some(x=>x.id===id);
  openAppWindow(id,f.name+f.ext,softwareInfoContent(id));
  if(!installed){updateAppContent(id,softwareInfoContent(id,"This version is not installed. Download it first."));return;}
  if(state.quarantinedSoftware[id]){updateAppContent(id,softwareInfoContent(id,"This executable is quarantined. Scan or extract its threat before running."));return;}
  if(f.kind==="cracker"){
    if(state.view!=="adminLogin"||!state.server[state.currentSite]){updateAppContent(id,softwareInfoContent(id,"Open a website or IP, choose Admin Login, then run this app."));return;}
    const site=state.currentSite,required=state.server[site].required||1;
    if(f.level<required){updateAppContent(id,softwareInfoContent(id,`This target requires Password Cracker L${required}. Your copy is L${f.level}.`));return;}
    startCrack(site,f.level);return;
  }
  if(f.kind==="waterwall"){
    if(state.view!=="adminLogin"||!state.server[state.currentSite]){updateAppContent(id,softwareInfoContent(id,"Open the target's Admin Login page first."));return;}
    const site=state.currentSite,srv=state.server[site];
    if(!state.cracked[site]){updateAppContent(id,softwareInfoContent(id,"Crack the admin password first."));return;}
    if(!srv.firewall){updateAppContent(id,softwareInfoContent(id,"No firewall detected on this host."));return;}
    if(f.level<srv.firewall){updateAppContent(id,softwareInfoContent(id,`Firewall L${srv.firewall} requires Waterwall L${srv.firewall} or higher.`));return;}
    startWaterwall(site,id);return;
  }
  if(f.kind==="uploader"){
    if(state.view!=="backend"||!state.access[state.currentSite]){updateAppContent(id,softwareInfoContent(id,"Open a compromised server's backend first."));return;}
    renderUploaderApp(id,state.currentSite);return;
  }
  if(f.kind==="cash"){renderCashWindow(id);return;}
  if(f.kind==="antimalware"){renderAntivirusAppV16(id);return;}
  if(f.kind==="extractor"){openAppWindow(id,f.name,extractorMainContentV11(id));return;}
  if(f.kind==="embedder"){openAppWindow(id,f.name,embedderMainContentV16(id));return;}
  if(f.kind==="payload"){updateAppContent(id,softwareInfoContent(id,"Use nefariousUploader to install this payload on an accessed server, or activate it locally for testing."));return;}
}

function scanLocalFileV11(file){

function scanPcTimedV16(appId){

function nextSweepDelayV16(site){
 const srv=state.server[site]||{},tier=srv.valueTier||1;
 const min=tier>=5?75000:tier>=4?120000:tier>=3?210000:300000;
 const max=tier>=5?210000:tier>=4?360000:tier>=3?480000:720000;
 return min+Math.random()*(max-min);
}
function runSecurityProtocolV11(){
 const now=Date.now(),reports=[];
 for(const [site,srv] of Object.entries(state.server)){
  if(!srv||srv.kind==="npcpc"&&Math.random()<.15)continue;
  if(!state.securityCheckAtV16[site])state.securityCheckAtV16[site]=now+20000+Math.random()*180000;
  if(now<state.securityCheckAtV16[site])continue;
  state.securityCheckAtV16[site]=now+nextSweepDelayV16(site);
  const tier=srv.valueTier||1;
  let sweepChanged=false;
  for(const w of [...(srv.warez||[])]){
   if(now-(w.createdAt||now)<60000)continue;
   const scrutiny=tier>=5?.93:tier>=4?.84:tier>=3?.67:tier>=2?.53:.38;
   const resistance=Math.min(.65,Math.max(0,(w.level||1)-1)*.135);
   if(Math.random()<Math.max(.05,scrutiny-resistance)){
    state.pendingCash=(state.pendingCash||0)+(w.earned||0);
    srv.warez=srv.warez.filter(x=>x!==w);
    const activeName=`Warez Virus L${w.level} (ACTIVE)`;
    srv.files=(srv.files||[]).filter(n=>n!==activeName);
    srv.uploaded=(srv.uploaded||[]).filter(f=>f.name!==activeName);
    recordServerV11(site,`SECURITY SWEEP REMOVED WAREZ L${w.level}`);
    reports.push(`${srv.name}: security sweep removed Warez L${w.level}`);
    sweepChanged=true;
   }
  }
  const hacked=!!state.access[site]||!!state.cracked[site];
  const grantedAt=srv.lastHackedAt||srv.lastCrackedAt||now;
  if(hacked&&now-grantedAt>=60000){
   const level=srv.lastCrackerLevel||srv.required||1;
   const scrutiny=tier>=5?.92:tier>=4?.82:tier>=3?.65:tier>=2?.52:.38;
   const chance=Math.max(.06,scrutiny-(level-1)*.14);
   if(Math.random()<chance){
    state.access[site]=false;state.cracked[site]=false;state.bypassed[site]=false;
    srv.password="pw"+Math.random().toString(36).slice(2,8).toUpperCase()+Math.floor(Math.random()*90+10);
    srv.lastSecurityReset=now;srv.lastHackedAt=now;
    recordServerV11(site,"SECURITY SWEEP DETECTED INTRUSION / ADMIN PASSWORD ROTATED");
    reports.push(`${srv.name}: intrusion found; admin password rotated`);
    sweepChanged=true;
    if(state.currentSite===site&&state.view==="backend")renderAdminLogin(site);
   }
  }
  for(const [name,inf] of Object.entries(srv.fileInfections||{})){
   if(!inf||now-(inf.installedAt||srv.lastModifiedAt||now)<60000)continue;
   const scrutiny=tier>=5?.84:tier>=4?.74:tier>=3?.6:tier>=2?.45:.3;
   const resistance=Math.min(.6,Math.max(0,(inf.embedderLevel||1)-1)*.13);
   if(Math.random()<Math.max(.06,scrutiny-resistance)){
    delete srv.fileInfections[name];srv.files=srv.files.filter(n=>n!==name);srv.uploaded=srv.uploaded.filter(f=>f.name!==name);
    recordServerV11(site,"SECURITY SWEEP REMOVED INFECTED FILE / "+name);
    reports.push(`${srv.name}: infected upload removed`);sweepChanged=true;
   }
  }
  if(sweepChanged&&state.view==="backend"&&state.currentSite===site&&state.backendTab==="files")renderBackend(site,"files");
 }
 if(reports.length)toast(reports[Math.floor(Math.random()*reports.length)]);
}
